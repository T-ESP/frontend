name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/t-esp/frontend:latest
            ghcr.io/t-esp/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout devops repo
        uses: actions/checkout@v4
        with:
          repository: T-ESP/devops
          token: ${{ secrets.GH_TOKEN }}
          path: devops

      - name: Install Ansible and dependencies
        run: |
          sudo apt update -y
          sudo apt install -y ansible python3-pip

      - name: Install Ansible docker collection
        run: |
          ansible-galaxy collection install community.docker

      - name: Setup SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 51.68.123.179 >> ~/.ssh/known_hosts

      - name: Deploy frontend with Ansible
        working-directory: devops
        run: |
          ansible-playbook -i inventory.ini deploy-frontend.yml \
            -e "gh_token=${{ secrets.GH_TOKEN }}" \
            -e "frontend_image_tag=${{ github.sha }}"
        env:
          ANSIBLE_HOST_KEY_CHECKING: False
