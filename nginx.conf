server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets aggressively
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html ne doit jamais être mis en cache : il référence les chunks hashés,
    # qui disparaissent au déploiement suivant. Un index.html périmé fait échouer
    # les imports dynamiques ("error loading dynamically imported module").
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
        try_files $uri /index.html;
    }
}
